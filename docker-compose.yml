version: "3.9"

# ── MedAssist Production Stack ────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d
#   3. docker compose logs -f backend   (watch migrations + server)
#
# Services:
#   db        — PostgreSQL 16 (production database)
#   redis     — Redis 7 (rate-limiting store + Celery broker)
#   backend   — FastAPI + Uvicorn (auto-migrates on start)
#   worker    — Celery worker (background AI & notification tasks)
#   mailhog   — SMTP dev/test server (disable in production)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: ${DB_USER:-medassist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medassist} -d medassist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-medassist}:${DB_PASSWORD}@db:5432/medassist
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@medassist.local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Durable report storage (P0): shared persistent volume mounted at the
      # path the API and workers resolve via settings.upload_dir.
      UPLOAD_DIR: /app/uploads/reports
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run Alembic migrations THEN start the server
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-medassist}:${DB_PASSWORD}@db:5432/medassist
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # P0: the worker sends follow-up emails — SMTP settings are required here.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@medassist.local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_DIR: /app/uploads/reports
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # P0: subscribe to every configured queue (ai, notifications, triage) plus
    # the default "celery" queue — previously the worker consumed none of the
    # routed queues, so report analysis and reminders never ran.
    # Task/worker events are emitted (see celery_app.py), so queue depth,
    # retries and failures are observable by consumers of Celery events
    # already shipped in the image (e.g. Sentry); a dedicated dashboard such
    # as Flower is a P1 item.
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q ai,notifications,triage,celery

  # ── Celery Beat (single scheduler — do NOT scale this service) ──────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-medassist}:${DB_PASSWORD}@db:5432/medassist
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app beat --loglevel=info

  # ── MailHog (Dev SMTP — REMOVE in production) ───────────────────────────────
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    profiles:
      - dev          # Only starts when: docker compose --profile dev up
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI → http://localhost:8025

volumes:
  pgdata:
    driver: local
  # Durable report storage shared by the API and the Celery worker (P0):
  # uploaded files now survive container replacement.
  uploads:
    driver: local
